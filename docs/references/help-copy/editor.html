    <style>
      :root {
        color-scheme: light dark;
        --canvas: #fafafa;
        --sidebar: #f2f2f2;
        --field: #ffffff;
        --ink: #202124;
        --quiet: #66686d;
        --line: #dddddf;
        --hover: #e8e8ea;
        --selected: #e2e2e5;
        --button: #27272a;
        --button-text: #ffffff;
        --ring: #777980;
        --error: #ae3030;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #19191b;
          --sidebar: #222225;
          --field: #202023;
          --ink: #efeff1;
          --quiet: #b0b0b7;
          --line: #3a3a40;
          --hover: #2e2e33;
          --selected: #37373d;
          --button: #efeff1;
          --button-text: #202023;
          --ring: #9c9ca5;
          --error: #ff9f9f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
      }
      select,
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: default;
        border: 0;
        border-radius: 7px;
        background: transparent;
      }
      select:focus-visible,
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.45;
      }
      button:not(:disabled):hover {
        background: var(--hover);
      }
      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--field);
      }
      input {
        padding: 11px 12px;
      }
      textarea {
        padding: 16px;
        resize: vertical;
        line-height: 1.75;
      }
      label {
        display: block;
        margin-bottom: 9px;
        font-size: 13px;
        color: var(--quiet);
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      h2 {
        font-size: 23px;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      [hidden] {
        display: none !important;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        min-height: 520px;
      }
      .toolbar {
        min-height: 68px;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        border-bottom: 1px solid var(--line);
      }
      .language {
        color: var(--quiet);
        font-size: 13px;
      }
      .actions {
        margin-left: auto;
        display: flex;
        gap: 8px;
      }
      .actions button,
      .pager button {
        padding: 10px 14px;
        white-space: nowrap;
      }
      .actions .primary {
        background: var(--button);
        color: var(--button-text);
      }
      .actions .primary:not(:disabled):hover {
        opacity: 0.88;
        background: var(--button);
      }
      .layout {
        display: grid;
        grid-template-columns: 266px minmax(0, 1fr);
        flex: 1;
        min-height: 0;
      }
      aside {
        background: var(--sidebar);
        border-right: 1px solid var(--line);
        display: flex;
        min-height: 0;
        flex-direction: column;
      }
      .search {
        padding: 20px 16px 12px;
      }
      .search input {
        background: var(--canvas);
        border: 0;
      }
      nav {
        overflow-y: auto;
        min-height: 0;
        padding: 0 12px 18px;
        flex: 1;
      }
      .category {
        margin-top: 17px;
      }
      .category h2 {
        margin: 0 8px 6px;
        color: var(--quiet);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0;
        line-height: 1.5;
      }
      .article-link {
        width: 100%;
        padding: 10px 9px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        text-align: left;
        line-height: 1.5;
        font-size: 13px;
      }
      .article-link[aria-current='page'],
      .side-actions button[aria-current='page'] {
        background: var(--selected);
      }
      .changed-mark {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--quiet);
        flex-shrink: 0;
      }
      .side-actions {
        border-top: 1px solid var(--line);
        padding: 12px;
        display: grid;
        gap: 3px;
      }
      .side-actions button {
        text-align: left;
        padding: 10px 9px;
        font-size: 13px;
      }
      .link-tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }
      .link-tools label {
        margin: 0;
      }
      .link-tools select {
        min-width: 150px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--field);
        padding: 7px;
        cursor: default;
      }
      .link-tools button {
        padding: 8px 10px;
        background: var(--sidebar);
      }
      .link-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .link-list button {
        text-align: left;
        padding: 5px 8px;
        color: var(--quiet);
        font-size: 12px;
      }
      .link-hint {
        margin-top: 8px;
        color: var(--quiet);
        font-size: 12px;
      }
      .empty {
        color: var(--quiet);
        padding: 20px 8px;
        font-size: 13px;
      }
      main {
        overflow-y: auto;
        min-width: 0;
        padding: 28px;
      }
      .content {
        max-width: 820px;
        margin: 0 auto;
      }
      .field + .field {
        margin-top: 25px;
      }
      #article-title {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.025em;
        padding: 13px 14px;
      }
      #article-text {
        min-height: 310px;
        font-size: 15px;
      }
      .pager {
        display: flex;
        justify-content: space-between;
        margin-top: 14px;
      }
      .fields {
        margin-top: 26px;
        display: grid;
        gap: 22px;
      }
      .statusbar {
        min-height: 43px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 20px;
        align-items: center;
        padding: 11px 24px;
        font-size: 12px;
        color: var(--quiet);
      }
      #change-count {
        margin-left: auto;
        white-space: nowrap;
      }
      .notice {
        padding: 12px 24px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        color: var(--error);
        line-height: 1.6;
      }
      .notice button {
        text-decoration: underline;
        padding: 2px 6px;
      }
      @media (max-width: 760px) {
        .layout {
          grid-template-columns: 215px minmax(0, 1fr);
        }
        main {
          padding: 22px 18px;
        }
        .toolbar {
          padding-inline: 18px;
          gap: 10px;
        }
        .language {
          display: none;
        }
      }
      @media (max-width: 540px) {
        .app {
          height: auto;
          min-height: 100dvh;
        }
        .toolbar {
          flex-wrap: wrap;
          padding: 16px;
        }
        .actions {
          gap: 0;
        }
        .actions button {
          padding: 9px 10px;
          font-size: 12px;
        }
        .layout {
          display: block;
        }
        aside {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          max-height: 260px;
        }
        .search {
          padding-top: 12px;
        }
        .side-actions {
          display: flex;
        }
        main {
          overflow: visible;
        }
        .statusbar {
          padding-inline: 16px;
          align-items: start;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="help-copy-editor">
      <header class="toolbar">
        <h1>Help editor</h1>
        <span class="language">English</span>
        <div class="actions">
          <button type="button" id="load-edits">Open edits</button>
          <button type="button" id="download-edits" class="primary" disabled>Download edits</button>
        </div>
        <input type="file" id="import-file" accept=".json,application/json" hidden />
      </header>
      <div class="notice" id="notice" role="alert" hidden></div>
      <div class="layout">
        <aside>
          <div class="search">
            <input
              type="search"
              id="search"
              aria-label="Find an article"
              placeholder="Find an article"
              autocomplete="off"
            />
          </div>
          <nav id="article-nav" aria-label="Help articles"></nav>
          <div class="side-actions">
            <button type="button" id="section-names">Section names</button>
            <button type="button" id="help-labels">Help labels</button>
          </div>
        </aside>
        <main>
          <div class="content">
            <section id="article-editor" aria-label="Edit article">
              <div class="field">
                <label for="article-title">Title</label
                ><input id="article-title" autocomplete="off" />
              </div>
              <div class="field">
                <label for="article-text">Text</label
                ><textarea
                  id="article-text"
                  spellcheck="true"
                  aria-describedby="link-hint"
                ></textarea>
                <div class="link-tools">
                  <label for="link-destination">Link to screen</label>
                  <select id="link-destination"></select>
                  <button id="apply-link" type="button" disabled>Add link</button>
                  <button id="remove-link" type="button" hidden>Remove link</button>
                </div>
                <p class="link-hint" id="link-hint" role="status">
                  Select text to link to a screen.
                </p>
                <div class="link-list" id="article-links" aria-label="Screen links"></div>
              </div>
              <div class="pager">
                <button type="button" id="previous">Previous article</button
                ><button type="button" id="next">Next article</button>
              </div>
            </section>
            <section id="labels-editor" hidden>
              <h2 id="labels-heading" tabindex="-1"></h2>
              <div id="label-fields" class="fields"></div>
            </section>
          </div>
        </main>
      </div>
      <footer class="statusbar">
        <span id="save-status" role="status">Choose an article and edit its text</span
        ><span id="change-count">No changes yet</span>
      </footer>
    </div>

          "helpCenter.article.send.body": "Choose Send from Wallet or an asset. Select the source, enter the amount and recipient, then open Review. For supported Verus routes you can use a VerusID; check the identity and resolved destination shown by the wallet.\n\nThe review can change the sendable amount to leave room for fees. Read the final values before sending. Once a transaction is confirmed, the wallet cannot undo it. Returning from Help preserves your form, but a transfer may require a fresh review before submission.",

          "helpCenter.article.recovery.title": "What should I back up?",
          "helpCenter.article.recovery.summary": "Keep the recovery secret for every set of funds you use, including a separate Private Verus secret if you created or imported one.",
          "helpCenter.article.recovery.body": "Open Settings, then Profile and security, to view recovery information. Private Verus recovery information is also accessible from its settings. Follow the wallet prompts and keep an accurate offline copy. A separately imported key may protect only its own addresses.\n\nAnyone with a recovery phrase or spending key can potentially use the funds it controls. Do not share it in chat, screenshots or a support form. Your local password and your recovery secret serve different purposes; knowing the password alone does not restore a lost installation.",
          "helpCenter.article.recovery.keywords": "backup seed phrase secret private spending key 24 words safety lost device",
          "helpCenter.article.forgot-password.title": "I cannot unlock my wallet",
          "helpCenter.article.forgot-password.summary": "A forgotten local password cannot be recovered by the wallet or the community.",
          "helpCenter.article.forgot-password.body": "If you have the original recovery phrase or another supported recovery secret, import it as a wallet and set a new local password. Choose the import method that matches your backup and use the correct network. You may need to restore a separate Private Verus secret as well.\n\nKeep the old installation and its files until you have checked your restored addresses and balances. Importing keys does not recreate local contacts or notes. VerusID recovery is a separate mechanism and is only useful when the required authority can still authorize recovery.",
          "helpCenter.article.forgot-password.keywords": "forgot password lost access locked unlock reset restore import device",
          "helpCenter.article.guard.title": "What VerusID Guard can recover",
          "helpCenter.article.guard.summary": "VerusID Guard helps an authorized revocation or recovery authority act on a VerusID.",
          "helpCenter.article.guard.body": "Revocation disables normal use of the identity once the revocation takes effect on-chain. Recovery can assign new primary control to a revoked identity. Both require the appropriate authority and an on-chain transaction; selecting an authority does not help if you also lose access to its keys.\n\nGuard is available from Welcome and Unlock. It does not reset a local password or recover arbitrary Bitcoin, Ethereum or ordinary address funds. If keys are compromised, identity recovery only addresses what that identity controls. Check the identity, authorities, network and proposed changes before approving.",
          "helpCenter.article.guard.keywords": "revoke recover guard stolen compromised freeze authority identity lost keys",
          "helpCenter.article.private-verus.title": "Setting up Private Verus",
          "helpCenter.article.private-verus.summary": "Private Verus uses a shielded address and needs its own recovery material and synchronization.",
          "helpCenter.article.private-verus.body": "Open Settings, then Private Verus. Depending on your wallet, you can reuse the primary recovery phrase, create a new privacy recovery secret, or import one. If you create or import a separate secret, back it up separately. The primary wallet backup alone may not restore those private funds.\n\nLet private synchronization finish before sending. It scans the chain for funds the private keys can use. A new installation or restored privacy secret may need time to find the full balance. Follow any setup or restart instructions shown by the wallet.",
          "helpCenter.article.private-verus.keywords": "privacy shielded zs sapling dlight sync synchronize private setup seed",
          "helpCenter.article.private-send.title": "Private addresses and transaction memos",
          "helpCenter.article.private-send.summary": "A shielded address protects different information from a public receiving address. Check both ends of the transfer.",
          "helpCenter.article.private-send.body": "Private Verus sends can target supported shielded or transparent Verus destinations. Sending to a public address exposes the receiving side on-chain. Using the private source does not make a public destination private.\n\nPrivate memos are supported for shielded destinations. The wallet must finish private synchronization and prepare the transaction proof before it can submit. Proof generation can take time. If submission becomes uncertain, check history before trying another send.",
          "helpCenter.article.private-send.keywords": "memo message shielded transparent zs private proof slow privacy",
          "helpCenter.article.requests.title": "Reviewing a request from an app",
          "helpCenter.article.requests.summary": "A request asks the wallet to perform specific actions. Check the requester and each action before approving.",
          "helpCenter.article.requests.body": "Use Open request for a supported request, or open a supported wallet link. The wallet verifies the request and shows the actions it understands. These can include authentication and identity changes; some actions also require funding and a fee.\n\nA valid signature identifies the signer, but does not make the request desirable. Check the identity, permissions, destination and changes yourself. Reject an unexpected request. The Apps section is not currently an app directory, and Activity has no transaction history in this version; inspect an asset for its transactions.",
          "helpCenter.article.requests.keywords": "app apps request deeplink link sign signature authentication login permissions activity",
          "helpCenter.article.contacts.title": "Contacts and public profiles",
          "helpCenter.article.contacts.summary": "Contacts store recipients and private notes in this wallet. A linked public profile comes from the VerusID.",
          "helpCenter.article.contacts.body": "Save a contact with a supported address, or associate a VerusID. A public profile can help you recognize the identity; your own note stays local. Check the selected receiving address and network each time you pay.\n\nDeleting a contact removes the local entry. It does not delete the person's VerusID, public profile or blockchain transactions. Contacts are encrypted in this installation and are not recreated just by importing the wallet recovery phrase on another device.",
          "helpCenter.article.contacts.keywords": "contact address book recipient private note save delete profile",
          "helpCenter.article.watchlist.title": "What the Watchlist shows",
          "helpCenter.article.watchlist.summary": "The Watchlist follows public holdings of supported Verus addresses and identities.",
          "helpCenter.article.watchlist.body": "Adding an address or identity lets you inspect its available public balances. It does not import a key or grant permission to spend. Watched funds are separate from funds this wallet controls.\n\nResults depend on the supported networks and the data that can be reached. An unavailable or partially loaded result is not proof of a zero balance. Private balances cannot be discovered from a public address lookup. Removing a watched entry changes your local list only.",
          "helpCenter.article.watchlist.keywords": "watch watchlist read only public balance address identity holdings",
          "helpCenter.article.local-data.title": "What stays on this device?",
          "helpCenter.article.local-data.summary": "Keys and local wallet records serve a different purpose from public blockchain records.",
          "helpCenter.article.local-data.body": "Contacts, private notes, watchlist choices and display settings are local wallet data. Publishing a VerusID profile does not publish these records. Importing a recovery secret restores the keys it represents, not a copy of every local setting or contact.\n\nPublic transactions and published profile history remain on their networks. Locking the wallet protects local access; it does not hide information that is already public. Keep the original wallet files until you have verified any move to a new installation.",
          "helpCenter.article.local-data.keywords": "local data device privacy restore backup sync contacts notes storage public",
          "helpCenter.article.settings.title": "Display, language and wallet locking",
          "helpCenter.article.settings.summary": "Settings controls appearance, display currency, language, auto-lock and access to recovery information.",
          "helpCenter.article.settings.body": "Use Display and language to choose a theme, language or fiat display currency. Changing the display currency changes estimates in the interface; it does not convert your funds.\n\nProfile and security includes the inactivity lock interval and recovery access. Lock ends the current unlocked session, so finish or safely leave your work first. Private Verus has its own setup page. About and support shows the app version, which is useful when reporting a problem.",
          "helpCenter.article.settings.keywords": "settings theme dark light language fiat euro currency auto lock version",
          "helpCenter.article.support.title": "Getting help from the community",
          "helpCenter.article.support.summary": "Describe what you tried, what you expected and the message the wallet showed.",
          "helpCenter.article.support.body": "Include the app version, network and asset. A public transaction ID can help with a transfer problem, but it can also reveal transaction details. Review screenshots before sharing them and remove anything private.\n\nUse Ask the community to open the Verus Discord. Never send a recovery phrase, private key, spending key or password to someone offering help. Core Help articles work offline; community links, live balances and network lookups require a connection.",
          "helpCenter.article.support.keywords": "support community discord error problem report bug offline help",

    <script>
      (() => {
        'use strict';
        const data = JSON.parse(document.getElementById('help-copy-data').textContent);
        const root = document.getElementById('help-copy-editor');
        const get = (id) => root.querySelector('#' + id);
        const storageKey = 'wallet-help-copy:' + data.sourceId;
        const baseline = data.baseline;
        const articleKeys = new Set(
          // Retain baseline keys so removing an article cannot invalidate saved drafts.
          Object.keys(baseline).filter((key) =>
            /^helpCenter\.article\..+\.(title|summary|body)$/.test(key)
          )
        );
        const allowedKeys = new Set([
          ...articleKeys,
          ...data.categories.map((c) => c.key),
          ...data.labels.map((l) => l.key),
        ]);
        const linkKeys = new Set([...articleKeys].filter((key) => /\.(summary|body)$/.test(key)));
        const removedKeys = new Set(
          [...articleKeys].filter((key) =>
            data.removedArticleIds.some((id) => key.startsWith('helpCenter.article.' + id + '.'))
          )
        );
        const baselineLinks = Object.fromEntries(
          [...linkKeys].map((key) => [key, data.baselineLinks[key] ?? []])
        );
        let links = structuredClone(baselineLinks);
        let editorText = '';
        let selection = { start: 0, end: 0 };
        let values = reviseLinkedCopy({ ...baseline, ...data.initialChanges }, links);
        let selected = data.articles[0].id;
        let mode = 'article';
        let saveTimer;
        let recoveryRequired = false;
        let draftUnsaved = false;
        let downloadedAt = null;
        const title = get('article-title');
        const text = get('article-text');
        const nav = get('article-nav');
        const status = get('save-status');
        const notice = get('notice');

        // Apply this requested wording correction once to older drafts, replacing
        // only the known phrases so unrelated edits remain intact.
        function reviseCopy(candidate, appliedRevision) {
          if (appliedRevision === data.copyRevision) return candidate;
          for (const edit of data.copyEdits ?? []) {
            for (const [from, to] of edit.replacements) {
              candidate[edit.key] = candidate[edit.key].replaceAll(from, to);
            }
          }
          return candidate;
        }

        function sameLinks(a, b) {
          return JSON.stringify(a) === JSON.stringify(b);
        }
        function changedLinkKeys() {
          return [...linkKeys].filter((key) => !sameLinks(links[key], baselineLinks[key]));
        }
        function changedLinkValues() {
          return Object.fromEntries(changedLinkKeys().map((key) => [key, links[key]]));
        }
        function allChangedKeys() {
          return [...new Set([...changedKeys(), ...changedLinkKeys()])];
        }
        function validateLinks(candidate, value) {
          if (!Array.isArray(candidate))
            throw new Error('Invalid screen links. Your draft is unchanged.');
          let end = 0;
          return candidate.map((link) => {
            if (
              !link ||
              !Object.hasOwn(data.destinations, link.destination) ||
              !Number.isInteger(link.start) ||
              !Number.isInteger(link.end) ||
              link.start < end ||
              link.start < 0 ||
              link.end <= link.start ||
              link.end > value.length ||
              !value.slice(link.start, link.end).trim() ||
              /[\r\n\[\]]/.test(value.slice(link.start, link.end))
            )
              throw new Error('Invalid screen links. Your draft is unchanged.');
            end = link.end;
            return { start: link.start, end: link.end, destination: link.destination };
          });
        }
        // Edits move explicit ranges. Renaming a linked span retains its target;
        // deletion or edits crossing its boundary remove it instead of guessing.
        function moveLinks(before, after, ranges) {
          let start = 0;
          while (start < before.length && start < after.length && before[start] === after[start])
            start++;
          if (start === before.length && start === after.length) return structuredClone(ranges);
          let oldEnd = before.length,
            newEnd = after.length;
          while (oldEnd > start && newEnd > start && before[oldEnd - 1] === after[newEnd - 1]) {
            oldEnd--;
            newEnd--;
          }
          const delta = newEnd - oldEnd;
          return ranges.flatMap((link) => {
            let next;
            if (
              oldEnd <= link.start &&
              !(start === oldEnd && start > link.start && start < link.end)
            )
              next = { ...link, start: link.start + delta, end: link.end + delta };
            else if (start >= link.end) next = { ...link };
            else if (start >= link.start && oldEnd <= link.end)
              next = { ...link, end: link.end + delta };
            if (
              !next ||
              next.end <= next.start ||
              !after.slice(next.start, next.end).trim() ||
              /[\r\n\[\]]/.test(after.slice(next.start, next.end))
            )
              return [];
            return [next];
          });
        }
        // Older text-only drafts do not declare link edits. Keep default links
        // only for unchanged fields; never attach a target by matching wording.
        function legacyLinks(candidate) {
          return Object.fromEntries(
            [...linkKeys].map((key) => [
              key,
              candidate[key] === baseline[key] ? structuredClone(baselineLinks[key]) : [],
            ])
          );
        }
        function reviseLinkedCopy(candidate, candidateLinks, revision) {
          const before = { ...candidate };
          reviseCopy(candidate, revision);
          for (const key of linkKeys)
            candidateLinks[key] = moveLinks(before[key], candidate[key], candidateLinks[key]);
          return candidate;
        }
        function currentArticle() {
          return data.articles.find((a) => a.id === selected);
        }
        function combinedLinks() {
          const a = currentArticle(),
            offset = values[a.summaryKey].length + 2;
          return [
            ...links[a.summaryKey],
            ...links[a.bodyKey].map((link) => ({
              ...link,
              start: link.start + offset,
              end: link.end + offset,
            })),
          ];
        }
        function storeCombinedLinks(ranges) {
          const a = currentArticle(),
            offset = values[a.summaryKey].length + 2;
          links[a.summaryKey] = ranges.filter((link) => link.end <= offset - 2);
          links[a.bodyKey] = ranges
            .filter((link) => link.start >= offset)
            .map((link) => ({ ...link, start: link.start - offset, end: link.end - offset }));
        }
        function selectedLink() {
          return combinedLinks().find(
            (link) =>
              selection.start >= link.start &&
              selection.end <= link.end &&
              selection.start < link.end
          );
        }
        function updateLinkTools() {
          const link = selectedLink();
          const a = currentArticle(),
            offset = values[a.summaryKey].length + 2;
          const valid =
            selection.end > selection.start &&
            (selection.end <= offset - 2 || selection.start >= offset) &&
            text.value.slice(selection.start, selection.end).trim() &&
            !/[\r\n\[\]]/.test(text.value.slice(selection.start, selection.end));
          get('apply-link').disabled = !link && !valid;
          get('apply-link').textContent = link ? 'Update link' : 'Add link';
          get('remove-link').hidden = !link;
          if (link) get('link-destination').value = link.destination;
          get('link-hint').textContent = link
            ? 'Linked to ' +
              data.destinations[link.destination].label +
              '. Change the screen or remove the link.'
            : valid
              ? 'Choose the screen for the selected text.'
              : 'Select text within one paragraph to link to a screen.';
        }
        function renderLinks() {
          const list = get('article-links');
          list.replaceChildren();
          for (const link of combinedLinks()) {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent =
              text.value.slice(link.start, link.end) +
              ' → ' +
              data.destinations[link.destination].label;
            button.addEventListener('click', () => {
              text.focus();
              text.setSelectionRange(link.start, link.end);
              selection = { start: link.start, end: link.end };
              updateLinkTools();
            });
            list.append(button);
          }
          updateLinkTools();
        }
        for (const [id, destination] of Object.entries(data.destinations)) {
          const option = document.createElement('option');
          option.value = id;
          option.textContent = destination.label;
          get('link-destination').append(option);
        }
        for (const event of ['select', 'keyup', 'mouseup', 'focus'])
          text.addEventListener(event, () => {
            selection = { start: text.selectionStart, end: text.selectionEnd };
            updateLinkTools();
          });
        get('apply-link').addEventListener('click', () => {
          const existing = selectedLink();
          const range = existing ?? selection;
          const destination = get('link-destination').value;
          if (!Object.hasOwn(data.destinations, destination) || get('apply-link').disabled) return;
          storeCombinedLinks(
            [
              ...combinedLinks().filter(
                (link) => link.end <= range.start || link.start >= range.end
              ),
              { start: range.start, end: range.end, destination },
            ].sort((a, b) => a.start - b.start)
          );
          change();
          renderLinks();
        });
        get('remove-link').addEventListener('click', () => {
          const existing = selectedLink();
          if (!existing) return;
          storeCombinedLinks(combinedLinks().filter((link) => link.start !== existing.start));
          change();
          renderLinks();
          text.focus();
        });

        function changedKeys() {
          return [...allowedKeys].filter((key) => values[key] !== baseline[key]);
        }
        function changedValues() {
          return Object.fromEntries(changedKeys().map((key) => [key, values[key]]));
        }
        function validChanges(candidate) {
          if (!candidate || typeof candidate !== 'object' || Array.isArray(candidate)) return false;
          return Object.entries(candidate).every(
            ([key, value]) => allowedKeys.has(key) && typeof value === 'string'
          );
        }
        function showNotice(message) {
          notice.textContent = message;
          notice.hidden = false;
        }
        function time() {
          return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        function updateStatus() {
          const changed = allChangedKeys();
          const articles = data.articles.filter((a) =>
            [a.titleKey, a.summaryKey, a.bodyKey].some((key) => changed.includes(key))
          ).length;
          const labels = changed.filter((key) => !articleKeys.has(key)).length;
          const parts = [];
          if (articles)
            parts.push(articles + (articles === 1 ? ' article changed' : ' articles changed'));
          if (labels) parts.push(labels + (labels === 1 ? ' label changed' : ' labels changed'));
          if (changed.some((key) => removedKeys.has(key)))
            parts.push('Removed article edits preserved');
          get('change-count').textContent = parts.join(' · ') || 'No changes yet';
          get('download-edits').disabled = !changed.length;
        }
        function saveDraft() {
          clearTimeout(saveTimer);
          saveTimer = undefined;
          if (recoveryRequired) {
            status.textContent = 'Browser saving unavailable · Download edits to keep your changes';
            return;
          }
          try {
            localStorage.setItem(
              storageKey,
              JSON.stringify({
                version: 2,
                sourceId: data.sourceId,
                copyRevision: data.copyRevision,
                changes: changedValues(),
                linkChanges: changedLinkValues(),
                selected,
                mode,
              })
            );
            draftUnsaved = false;
            status.textContent = 'Saved in this browser · ' + time();
          } catch {
            draftUnsaved = true;
            status.textContent = 'Browser saving unavailable · Download edits to keep your changes';
          }
        }
        function change() {
          downloadedAt = null;
          draftUnsaved = true;
          updateStatus();
          status.textContent = 'Saving in this browser…';
          clearTimeout(saveTimer);
          saveTimer = setTimeout(saveDraft, 250);
          renderNav();
        }
        function renderNav() {
          const scroll = nav.scrollTop;
          nav.replaceChildren();
          const query = get('search').value.trim().toLowerCase();
          let count = 0;
          for (const category of data.categories) {
            const articles = data.articles.filter(
              (a) =>
                a.category === category.id &&
                (values[a.titleKey] + ' ' + values[a.summaryKey] + ' ' + values[a.bodyKey])
                  .toLowerCase()
                  .includes(query)
            );
            if (!articles.length) continue;
            const section = document.createElement('section');
            section.className = 'category';
            const heading = document.createElement('h2');
            heading.textContent = values[category.key];
            section.append(heading);
            for (const article of articles) {
              count++;
              const button = document.createElement('button');
              button.type = 'button';
              button.className = 'article-link';
              button.dataset.article = article.id;
              if (mode === 'article' && selected === article.id)
                button.setAttribute('aria-current', 'page');
              const label = document.createElement('span');
              label.textContent = values[article.titleKey] || 'Untitled article';
              button.append(label);
              if (
                [article.titleKey, article.summaryKey, article.bodyKey].some(
                  (key) =>
                    values[key] !== baseline[key] ||
                    (linkKeys.has(key) && !sameLinks(links[key], baselineLinks[key]))
                )
              ) {
                const dot = document.createElement('span');
                dot.className = 'changed-mark';
                dot.setAttribute('aria-label', 'Edited');
                button.append(dot);
              }
              button.addEventListener('click', () => selectArticle(article.id));
              section.append(button);
            }
            nav.append(section);
          }
          if (!count) {
            const empty = document.createElement('p');
            empty.className = 'empty';
            empty.textContent = 'No matching articles';
            nav.append(empty);
          }
          nav.scrollTop = scroll;
          for (const [id, target] of [
            ['section-names', 'categories'],
            ['help-labels', 'labels'],
          ]) {
            if (mode === target) get(id).setAttribute('aria-current', 'page');
            else get(id).removeAttribute('aria-current');
          }
        }
        function renderEditor(focus = false) {
          get('article-editor').hidden = mode !== 'article';
          get('labels-editor').hidden = mode === 'article';
          if (mode === 'article') {
            const article = data.articles.find((a) => a.id === selected);
            title.value = values[article.titleKey];
            text.value = [values[article.summaryKey], values[article.bodyKey]].join('\n\n');
            editorText = text.value;
            selection = { start: 0, end: 0 };
            renderLinks();
            const index = data.articles.indexOf(article);
            get('previous').disabled = index === 0;
            get('next').disabled = index === data.articles.length - 1;
            if (focus) title.focus({ preventScroll: true });
          } else {
            get('labels-heading').textContent =
              mode === 'categories' ? 'Section names' : 'Help labels';
            const fields = get('label-fields');
            fields.replaceChildren();
            const list =
              mode === 'categories'
                ? data.categories.map((c) => ({ key: c.key, label: baseline[c.key] }))
                : data.labels;
            list.forEach((field, index) => {
              const wrapper = document.createElement('div');
              const label = document.createElement('label');
              label.htmlFor = 'copy-field-' + index;
              label.textContent = field.label;
              const input = document.createElement('input');
              input.id = label.htmlFor;
              input.value = values[field.key];
              input.autocomplete = 'off';
              input.addEventListener('input', () => {
                values[field.key] = input.value;
                change();
              });
              wrapper.append(label, input);
              fields.append(wrapper);
            });
            if (focus) get('labels-heading').focus({ preventScroll: true });
          }
          root.querySelector('main').scrollTop = 0;
        }
        function selectArticle(id) {
          selected = id;
          mode = 'article';
          renderNav();
          renderEditor(true);
        }
        title.addEventListener('input', () => {
          const article = data.articles.find((a) => a.id === selected);
          values[article.titleKey] = title.value;
          change();
        });
        text.addEventListener('input', () => {
          const article = currentArticle();
          const nextText = text.value.replace(/\r\n?/g, '\n');
          const nextLinks = moveLinks(editorText, nextText, combinedLinks());
          const split = nextText.indexOf('\n\n');
          values[article.summaryKey] = split < 0 ? nextText : nextText.slice(0, split);
          values[article.bodyKey] = split < 0 ? '' : nextText.slice(split + 2);
          storeCombinedLinks(nextLinks);
          editorText = nextText;
          selection = { start: text.selectionStart, end: text.selectionEnd };
          change();
          renderLinks();
        });
        get('search').addEventListener('input', renderNav);
        get('previous').addEventListener('click', () => {
          const index = data.articles.findIndex((a) => a.id === selected);
          if (index > 0) selectArticle(data.articles[index - 1].id);
        });
        get('next').addEventListener('click', () => {
          const index = data.articles.findIndex((a) => a.id === selected);
          if (index < data.articles.length - 1) selectArticle(data.articles[index + 1].id);
        });
        for (const [id, target] of [
          ['section-names', 'categories'],
          ['help-labels', 'labels'],
        ])
          get(id).addEventListener('click', () => {
            mode = target;
            renderNav();
            renderEditor(true);
          });

        get('download-edits').addEventListener('click', () => {
          const changes = changedKeys().map((key) => ({
            key,
            before: baseline[key],
            after: values[key],
          }));
          const linkChanges = changedLinkKeys().map((key) => ({
            key,
            before: baselineLinks[key],
            after: links[key],
          }));
          if (!changes.length && !linkChanges.length) return;
          if (!values['helpCenter.resultCount'].includes('{count}')) {
            showNotice('Keep {count} in the article count label so the app can insert the number.');
            return;
          }
          const output = {
            format: 'wallet-help-edits',
            version: 2,
            locale: 'en',
            sourceId: data.sourceId,
            copyRevision: data.copyRevision,
            capturedOn: data.capturedOn,
            exportedAt: new Date().toISOString(),
            removedArticleIds: data.removedArticleIds,
            translationInstruction:
              'Apply the English edits and update the other supported app languages.',
            changes,
            linkChanges,
          };
          const blob = new Blob([JSON.stringify(output, null, 2) + '\n'], {
            type: 'application/json',
          });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'wallet-help-edits.json';
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 30000);
          downloadedAt = new Date().toISOString();
          status.textContent =
            'Download requested · Give the edits file to Codex to apply and translate';
        });
        get('load-edits').addEventListener('click', () => get('import-file').click());
        get('import-file').addEventListener('change', async (event) => {
          const file = event.target.files?.[0];
          if (!file) return;
          try {
            if (file.size > 2 * 1024 * 1024) throw new Error('This edits file is too large.');
            const imported = JSON.parse(await file.text());
            if (
              imported.format !== 'wallet-help-edits' ||
              ![1, 2].includes(imported.version) ||
              imported.locale !== 'en' ||
              imported.sourceId !== data.sourceId ||
              !Array.isArray(imported.changes)
            )
              throw new Error(
                'This edits file belongs to a different version. Give it to Codex to reconcile.'
              );
            const next = { ...baseline };
            const seen = new Set();
            for (const edit of imported.changes) {
              if (
                !edit ||
                !allowedKeys.has(edit.key) ||
                seen.has(edit.key) ||
                edit.before !== baseline[edit.key] ||
                typeof edit.after !== 'string'
              )
                throw new Error(
                  'This file contains an invalid or conflicting change. Your current draft is unchanged.'
                );
              seen.add(edit.key);
              next[edit.key] = edit.after;
            }
            const nextLinks =
              imported.version === 1 ? legacyLinks(next) : structuredClone(baselineLinks);
            if (imported.version === 2) {
              if (!Array.isArray(imported.linkChanges))
                throw new Error('Missing screen link metadata. Your draft is unchanged.');
              const seenLinks = new Set();
              for (const edit of imported.linkChanges) {
                if (
                  !edit ||
                  !linkKeys.has(edit.key) ||
                  seenLinks.has(edit.key) ||
                  !sameLinks(edit.before, baselineLinks[edit.key])
                )
                  throw new Error('Conflicting screen links. Your draft is unchanged.');
                seenLinks.add(edit.key);
                nextLinks[edit.key] = validateLinks(edit.after, next[edit.key]);
              }
              for (const key of linkKeys) nextLinks[key] = validateLinks(nextLinks[key], next[key]);
            }
            if (
              allChangedKeys().length &&
              !window.confirm(
                'Replace your current browser draft with this edits file? Download your current edits first if you want to keep both.'
              )
            )
              return;
            values = reviseLinkedCopy(next, nextLinks, imported.copyRevision);
            links = nextLinks;
            recoveryRequired = false;
            notice.hidden = true;
            downloadedAt = imported.exportedAt ?? null;
            saveDraft();
            updateStatus();
            renderNav();
            renderEditor();
          } catch (error) {
            showNotice(
              error instanceof SyntaxError
                ? 'This is not a readable edits file. Your draft is unchanged.'
                : error.message
            );
          } finally {
            event.target.value = '';
          }
        });

        try {
          const stored = localStorage.getItem(storageKey);
          if (stored) {
            const draft = JSON.parse(stored);
            if (
              ![1, 2].includes(draft.version) ||
              draft.sourceId !== data.sourceId ||
              !validChanges(draft.changes)
            )
              throw new Error('Invalid saved draft');
            const candidate = { ...baseline, ...draft.changes };
            const candidateLinks =
              draft.version === 1 ? legacyLinks(candidate) : structuredClone(baselineLinks);
            if (draft.version === 2) {
              if (
                !draft.linkChanges ||
                typeof draft.linkChanges !== 'object' ||
                Array.isArray(draft.linkChanges)
              )
                throw new Error('Invalid link draft');
              for (const [key, ranges] of Object.entries(draft.linkChanges)) {
                if (!linkKeys.has(key)) throw new Error('Unknown link field');
                candidateLinks[key] = validateLinks(ranges, candidate[key]);
              }
              for (const key of linkKeys)
                candidateLinks[key] = validateLinks(candidateLinks[key], candidate[key]);
            }
            values = reviseLinkedCopy(candidate, candidateLinks, draft.copyRevision);
            links = candidateLinks;
            if (data.articles.some((a) => a.id === draft.selected)) selected = draft.selected;
            if (['article', 'categories', 'labels'].includes(draft.mode)) mode = draft.mode;
            status.textContent = 'Browser draft restored';
          }
        } catch {
          recoveryRequired = true;
          showNotice(
            'The browser draft could not be restored. Download any new edits to keep them; the existing browser draft will not be overwritten.'
          );
          status.textContent = 'Browser saving unavailable · Use Download edits';
        }
        window.addEventListener('pagehide', () => {
          if (saveTimer) saveDraft();
        });
        window.addEventListener('beforeunload', (event) => {
          if (allChangedKeys().length && draftUnsaved && !downloadedAt) {
            event.preventDefault();
            event.returnValue = '';
          }
        });
        renderNav();
        renderEditor();
        updateStatus();
      })();
    </script>
  </body>
</html>
