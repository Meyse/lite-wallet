minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExcludePrune: true
trustLockfile: false
blockExoticSubdeps: true

overrides:
  'bs58@3.1.0>base-x': 3.0.11
  'verusd-rpc-ts-client@0.1.0>axios': 1.20.0
  'verusid-ts-client@0.1.0>axios': 1.20.0
  yaml: ^2.8.1

allowBuilds:
  # Native Tauri tests use the embedded driver, not downloaded browser drivers.
  edgedriver: false
  geckodriver: false
  '@bitgo/utxo-lib@https://codeload.github.com/VerusCoin/BitGoJS/tar.gz/2d3240429b7664fb01ca3f0f9e1c2b6da803f68d': false
  esbuild: true
  verus-typescript-primitives@https://codeload.github.com/VerusCoin/verus-typescript-primitives/tar.gz/3ffa9d77a3dd98c23fe4f66cf4368946906de780: false
  verusd-rpc-ts-client@https://codeload.github.com/VerusCoin/verusd-rpc-ts-client/tar.gz/e8ea8c21f8a3d845e20189440dcd820d16f00891: false
  verusid-ts-client@https://codeload.github.com/VerusCoin/verusid-ts-client/tar.gz/933e8f8da1a51b99ba7533701dddb9914b7a06b7: false

patchedDependencies:
  # The pinned commit contains evals.json, but its package files allowlist omits it.
  # Source: VerusCoin/bitcoin-ops@a5f8f56; evals.json SHA-256 c631cc581e36db9d2c20b675f941e815932ce7c855090f8e70506b3e3a0f33d2.
  # pnpm keys patches by name/version, so the same inert JSON is also added to the registry copy.
  bitcoin-ops@1.4.1: patches/bitcoin-ops@1.4.1.patch
