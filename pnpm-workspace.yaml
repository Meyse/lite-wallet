minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExcludePrune: true
trustLockfile: false
blockExoticSubdeps: true

overrides:
  'bs58@3.1.0>base-x': 3.0.11
  'verusd-rpc-ts-client@0.1.0>axios': 1.20.0
  'verusid-ts-client@0.1.0>axios': 1.20.0
  yaml: ^2.8.1

allowBuilds:
  # Native Tauri tests use the embedded driver, not downloaded browser drivers.
  edgedriver: false
  geckodriver: false
  '@bitgo/utxo-lib@https://codeload.github.com/VerusCoin/BitGoJS/tar.gz/9582a20f7211a7a6aed7bfae3c651e6b76c1f9bb': false
  esbuild: true
  verus-typescript-primitives@https://codeload.github.com/VerusCoin/verus-typescript-primitives/tar.gz/7a7b01db697222cd68507a9dbf15f289615ea890: false
  verusd-rpc-ts-client@https://codeload.github.com/VerusCoin/verusd-rpc-ts-client/tar.gz/58689ea52500a6a6e4aa741e5d2ed41d7bc6ddd7: false
  verusid-ts-client@https://codeload.github.com/VerusCoin/verusid-ts-client/tar.gz/0c39c0a4ba81378ac898cbe75ae1da7511617ccd: false

patchedDependencies:
  # The pinned commit contains evals.json, but its package files allowlist omits it.
  # Source: VerusCoin/bitcoin-ops@a5f8f56; evals.json SHA-256 c631cc581e36db9d2c20b675f941e815932ce7c855090f8e70506b3e3a0f33d2.
  # pnpm keys patches by name/version, so the same inert JSON is also added to the registry copy.
  bitcoin-ops@1.4.1: patches/bitcoin-ops@1.4.1.patch
