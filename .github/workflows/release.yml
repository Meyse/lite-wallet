name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release tag and versions
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: validate
        name: Validate version contract
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          TAG="$(echo "${TAG}" | xargs)"
          if [[ -z "${TAG}" ]]; then
            echo "Release tag is empty."
            exit 1
          fi

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '${TAG}' does not match required format vX.Y.Z or vX.Y.Z-prerelease."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            git fetch --tags --force
            if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "Tag '${TAG}' does not exist in this repository."
              exit 1
            fi
            git checkout --force "${TAG}"
          fi

          VERSION="${TAG#v}"
          PRERELEASE=false
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          fi

          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(
            sed -n '/^\[package\]/,/^\[/{s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p}' src-tauri/Cargo.toml | head -n 1
          )"

          if [[ -z "${PKG_VERSION}" || -z "${TAURI_VERSION}" || -z "${CARGO_VERSION}" ]]; then
            echo "Could not read one or more manifest versions."
            echo "package.json: '${PKG_VERSION}'"
            echo "tauri.conf.json: '${TAURI_VERSION}'"
            echo "Cargo.toml: '${CARGO_VERSION}'"
            exit 1
          fi

          if [[ "${PKG_VERSION}" != "${VERSION}" ]]; then
            echo "package.json version '${PKG_VERSION}' does not match tag '${VERSION}'."
            exit 1
          fi

          if [[ "${TAURI_VERSION}" != "${VERSION}" ]]; then
            echo "tauri.conf.json version '${TAURI_VERSION}' does not match tag '${VERSION}'."
            exit 1
          fi

          if [[ "${CARGO_VERSION}" != "${VERSION}" ]]; then
            echo "Cargo.toml version '${CARGO_VERSION}' does not match tag '${VERSION}'."
            exit 1
          fi

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            platform: macos-13
            target: x86_64-apple-darwin
          - name: macOS Apple Silicon
            platform: macos-14
            target: aarch64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Pin Yarn
        run: corepack prepare yarn@4.12.0 --activate

      - name: Get Yarn cache directory
        id: yarn-cache-dir
        shell: bash
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore Yarn cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        env:
          YARN_ENABLE_HARDENED_MODE: "0"
          YARN_CHECKSUM_BEHAVIOR: ignore
        run: yarn install --immutable

      - name: Build and publish draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.preflight.outputs.tag }}
          releaseName: Verus Express ${{ needs.preflight.outputs.tag }}
          releaseDraft: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          generateReleaseNotes: true
          args: --target ${{ matrix.target }}
